# CI: runs on every PR and on pushes to main.
#
# WHY: Sai develops on macOS and Om on WSL2. A PR that only passes "on my machine" is caught here,
#      on a clean Linux runner, before it's merged. It's also where guardrail tests (approval
#      token, allowlist) prove the rules still hold after every change (AGENTS.md rule 1).
# HOW: installs the exact versions from uv.lock (`--locked` fails if pyproject and lockfile
#      disagree, i.e. someone added a dependency and forgot `uv lock`), then lint + tests.
# No secrets are used: every test runs without network, GCP, Slack or an LLM.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Shell scripts
        # shellcheck is preinstalled on GitHub's ubuntu runners. The target stack and fault scripts
        # run against real containers in the eval, so a quoting bug here would corrupt results.
        run: shellcheck -x -S warning target/*.sh evals/faults/*/*.sh

      - name: Compose file
        # Validates target/docker-compose.yml without pulling images or starting anything.
        run: |
          mkdir -p target/runtime && cp target/known-good/* target/runtime/
          docker compose -p ir-target -f target/docker-compose.yml --env-file target/runtime/stack.env config --quiet

      - name: Tests
        run: uv run pytest
