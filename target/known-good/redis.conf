# Redis config for the cache. Known-good values.
# (redis.conf does not allow comments at the end of a directive line; keep them on their own lines.)
bind 0.0.0.0
# Reachable only on the compose network; the port is not published to the host.
protected-mode no
maxmemory 64mb
maxmemory-policy allkeys-lru
# No persistence: a restart gives a clean cache, so faults and resets are reproducible.
save ""
appendonly no
