id: api-bad-db-url-01
category: config
description: >
  DATABASE_URL in the api's environment points at host "db-primary", which doesn't exist (a
  config change for a planned migration, applied too early). The api is running, but /health
  returns 503 with a name-resolution error for "db". The db container itself is healthy, so
  "restart the database" is the wrong fix.
expected_fix: restore_config   # params: service=api, file=api.env (set_env is disabled on this executor)
expected_params:
  service: api
  file: api.env
timeout_s: 300
