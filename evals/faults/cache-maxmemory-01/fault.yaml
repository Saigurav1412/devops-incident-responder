id: cache-maxmemory-01
category: resource
description: >
  Redis maxmemory is cut to 1mb with the noeviction policy, then filled. Redis still answers PING
  (so its container healthcheck stays green), but every write fails with an OOM error, so the
  api's /health returns 503 for "cache". Tests whether the agent looks past "container is healthy".
expected_fix: restore_config   # params: service=cache, file=redis.conf (restart clears the data)
timeout_s: 300
